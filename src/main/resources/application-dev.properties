spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nomadas_travel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:nomadas_user}
spring.datasource.password=${DB_PASSWORD:nomadas_password}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:true}
app.demo-admin.username=${APP_DEMO_ADMIN_USERNAME:admin}
app.demo-admin.email=${APP_DEMO_ADMIN_EMAIL:admin@nomadas.local}
app.demo-admin.password=${APP_DEMO_ADMIN_PASSWORD:admin12345}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:h2:mem:nomadas_integration;MODE=MySQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2
spring.h2.console.enabled=false
app.demo-data.enabled=true
app.demo-admin.username=${APP_DEMO_ADMIN_USERNAME:admin}
app.demo-admin.email=${APP_DEMO_ADMIN_EMAIL:admin@nomadas.local}
app.demo-admin.password=${APP_DEMO_ADMIN_PASSWORD:admin12345}
